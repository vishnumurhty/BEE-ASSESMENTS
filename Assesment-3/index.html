<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Student Feedback Form</h1>

    <form id="feedbackForm">

        <div class="form-group">
            <label>Student Name</label>
            <input type="text" id="name">
            <small class="error" id="nameError"></small>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email">
            <small class="error" id="emailError"></small>
        </div>

        <div class="form-group">
            <label>Course</label>
            <select id="course">
                <option value="">Select Course</option>
                <option>Java</option>
                <option>Python</option>
                <option>JavaScript</option>
                <option>C++</option>
            </select>
            <small class="error" id="courseError"></small>
        </div>

        <div class="form-group">
            <label>Feedback</label>
            <textarea id="feedback" rows="5"></textarea>
            <small class="error" id="feedbackError"></small>
        </div>

        <button type="submit">Submit Feedback</button>
        <button type="button" id="deleteBtn">Delete Stored Data</button>

    </form>

    <hr>

    <h2>Current Session User</h2>
    <p id="sessionUser">No Active Session</p>

    <h2>Stored Feedback</h2>
    <div id="storedData">
        No feedback stored.
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
